name: Build Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Physics sanity check
        run: node tools/simtest.js ronin fox promod

      - name: Copy the game into the Android project
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../PixelDrag.apk

      - name: Upload APK (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: PixelDrag-apk
          path: PixelDrag.apk

      - name: Publish APK as a downloadable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.ref_name }}
          name: Pixel Drag APK (${{ github.ref_name }})
          body: |
            Latest Android build of Pixel Drag from branch `${{ github.ref_name }}` (commit ${{ github.sha }}).
            Download **PixelDrag.apk** on your Android phone and open it to install.
          prerelease: true
          files: PixelDrag.apk
          overwrite_files: true
